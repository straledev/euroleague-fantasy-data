name: Fantasy prices snapshot

on:
  schedule:
    - cron: "17 10 * * *"   # svaki dan u 10:17 UTC, kad se ne igra nijedna utakmica
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Take snapshot
        env:
          DUNKEST_TOKEN: ${{ secrets.DUNKEST_TOKEN }}
        run: python fantasy_scraper.py

      - name: Update player map
        run: python merger.py --season 2026 || true

      - name: Commit if a new snapshot was saved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash
          git add data/
          if git diff --cached --quiet; then
            echo "Nema novog snimka."
          else
            git commit -m "Fantasy snapshot $(date -u +'%Y-%m-%d')"
            git push
          fi